# mainブランチが更新されるたびに、アプリを自動ビルドして
# エックスサーバーへFTPSでアップロードするワークフローです。
#
# 動かすには、GitHubリポジトリの Settings → Secrets and variables →
# Actions → New repository secret で次の4つを登録してください:
#   FTP_SERVER     : FTPサーバー名 (例: sv12345.xserver.jp)
#   FTP_USERNAME   : FTPユーザー名 (サーバーID または FTPアカウント名)
#   FTP_PASSWORD   : FTPパスワード
#   FTP_TARGET_DIR : アップロード先 (例: /example.com/public_html/zcar/)
name: Deploy to Xserver

on:
  push:
    branches: [main]
  workflow_dispatch: # Actionsタブから手動実行も可能

concurrency:
  group: deploy-xserver
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: z-car-chrome
        run: npm ci --no-audit --no-fund

      - name: Build static site
        working-directory: z-car-chrome
        env:
          # 公開先のサブフォルダ名。FTPアカウントの接続先ディレクトリ
          # (…/public_html/zcar)と一致させること。
          BASE_PATH: /zcar
        # ビルド時刻を埋め込む。起動画面の右下に出るので、車載機が
        # 新しい版になっているかを目で確かめられる。
        run: |
          export NEXT_PUBLIC_BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "build time: $NEXT_PUBLIC_BUILD_TIME"
          npm run build:static

      # サーバーへのFTPS接続はまれにタイムアウトする(Timeout (control socket))。
      # 立て続けに繋ぎ直しても失敗しやすいので、間を空けて最大3回試す。
      - name: Upload via FTPS
        id: deploy1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          timeout: 120000
          local-dir: z-car-chrome/out/
          server-dir: ${{ secrets.FTP_TARGET_DIR }}

      - name: Wait before retry
        if: steps.deploy1.outcome == 'failure'
        run: sleep 45

      - name: Upload via FTPS (retry 1)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          timeout: 120000
          local-dir: z-car-chrome/out/
          server-dir: ${{ secrets.FTP_TARGET_DIR }}

      - name: Wait before final retry
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 90

      # 3回目も失敗したらジョブを失敗として終わらせる(黙って成功にしない)。
      - name: Upload via FTPS (retry 2)
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          timeout: 120000
          local-dir: z-car-chrome/out/
          server-dir: ${{ secrets.FTP_TARGET_DIR }}
